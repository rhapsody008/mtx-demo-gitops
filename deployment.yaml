apiVersion: apps/v1
kind: Deployment
metadata:
  name: zy-workload-app
  namespace: mtx-project-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zy-workload-app
  template:
    metadata:
      labels:
        app: zy-workload-app
    spec:
      containers:
        - name: app
          image: your-registry/zy-workload-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cluster-config
