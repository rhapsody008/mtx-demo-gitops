apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zy-workload-app
  namespace: mtx-project-demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zy-workload-app
                port:
                  number: 8080